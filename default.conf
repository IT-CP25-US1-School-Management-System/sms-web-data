server {
    listen 80;
    server_name _;

    root /code/dist/;
    index index.html index.htm;

    # เพิ่มส่วนนี้เข้าไปเพื่อให้ Nginx ส่ง Content-Type สำหรับ .mjs ได้ถูกต้อง
    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}